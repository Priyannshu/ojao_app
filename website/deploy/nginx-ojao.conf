# nginx config for ojao.in
#
# The site is a Next.js static export served as plain files. Because
# `output: "export"` ignores next.config.ts's headers() and redirects(), this
# file is the deployed source of truth for both. Keep the two in sync.
#
# Deploy:
#   sudo cp deploy/nginx-ojao.conf /etc/nginx/sites-available/ojao
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ojao.in www.ojao.in;
    return 301 https://ojao.in$request_uri;
}

# www -> apex, so only one hostname is canonical
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ojao.in;

    ssl_certificate     /etc/letsencrypt/live/ojao.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ojao.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://ojao.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ojao.in;

    ssl_certificate     /etc/letsencrypt/live/ojao.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ojao.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/ojao;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    # ---- Security headers ----
    # Mirrors next.config.ts. `always` so they apply to error responses too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # blob: in script-src/worker-src is required by the WebGL scenes.
    # cloudflareinsights.com is Cloudflare's Web Analytics beacon, injected at
    # the proxy layer — blocked by CSP unless named explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Redirects ----
    # /hospitals would compete with the already-indexed /industries/hospitals
    # for the same query, so one canonical URL wins and the rest redirect.
    location = /hospitals            { return 301 /industries/hospitals/; }
    location = /industries           { return 301 /industries/hospitals/; }
    location = /clinics              { return 301 /industries/clinics/; }
    location = /radiology            { return 301 /industries/radiology/; }
    location = /diagnostic-labs      { return 301 /industries/diagnostic-labs/; }
    location = /solutions            { return 301 /solutions/hospital-queue-management-software-india/; }
    # The previous site linked to this anchor; keep it landing somewhere real.
    location = /cta-section          { return 301 /#demo; }

    # ---- Long-cache immutable build output ----
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # The OG card is emitted without a file extension, so nginx would otherwise
    # serve it as application/octet-stream and social crawlers would reject it.
    location = /opengraph-image {
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location = /sitemap.xml { default_type application/xml; }
    location = /robots.txt  { default_type text/plain; }

    # ---- Routing ----
    # `trailingSlash: true` means every route is a directory with an
    # index.html, so $uri/ resolves cleanly. A missing path falls through to a
    # real 404 rather than an SPA catch-all, so bad URLs return the correct
    # status instead of 200 with the homepage.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Hide dotfiles except ACME challenges
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
