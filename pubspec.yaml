name: ojao_app
description: "ojao — Premium Healthcare Patient Flow & Virtual Queue Solution"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Typography (matches ojao web brand)
  google_fonts: ^6.2.1

  # Firebase (backend for MVP)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # Payments (India: Razorpay)
  razorpay_flutter: ^1.4.1

  # Video / chat consult
  flutter_webrtc: ^0.12.0

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # Notifications & connectivity
  flutter_local_notifications: ^17.2.3
  connectivity_plus: ^6.0.5

  # Location (near-me facility discovery)
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
